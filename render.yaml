services:
  - type: web
    name: openclaw-echo
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_MODE
        value: polling
      - key: GOOGLE_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: DEMO_ACCESS_CODE_HASH
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
